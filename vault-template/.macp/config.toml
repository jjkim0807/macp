# Vault configuration. Its presence also marks this directory as a vault, so
# commands run from inside it find the vault without MACP_VAULT_ROOT.
# Every key is optional; the matching MACP_* environment variable wins.

# Prefix for launchd/systemd daemon labels (MACP_LABEL_PREFIX).
# label_prefix = "com.example."

# Google Calendar id that `cli calendar-sync` writes due tasks to (MACP_CALENDAR_ID).
# calendar_id = "primary"

# owner/repo of THIS vault's git remote, used in links and PR bodies (MACP_REPO_SLUG).
# repo_slug = "you/my-vault"

# IANA timezone calendar events are written in (MACP_TIMEZONE). Left unset, events
# carry no timezone and Google applies the target calendar's own.
# timezone = "Asia/Seoul"

# Where external repos (`repo:` tasks) are cloned (MACP_WORKER_ROOT). Default ~/Worker.
# worker_root = "~/Worker"

# UI language for engine log/CLI text: "en" | "ko" (MACP_LANGUAGE). Default "en".
# language = "en"

# Orchestrator state backend: "git" (default) or "external" (MACP_STATE_BACKEND).
# state_backend = "git"

# SQLite path the "external" state backend reads/writes (MACP_STATE_SQLITE_PATH).
# Default $XDG_DATA_HOME/macp/state.sqlite, else ~/.local/share/macp/state.sqlite.
# state_sqlite_path = "~/.local/share/macp/state.sqlite"
